<!DOCTYPE html>
<html xmlns:th= "http://www.thymeLeaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<script>
    function deleteQuestion(id) {
        fetch('/deleteQuestion/' + id, {
            method: 'DELETE'
        })
            .then(response => {
                if (response.ok) {
                    window.location.reload();
                    // window.location.href = '/all_question';
                }
            });
    }
    function updateQuestion(id) {
        fetch('/updateQuestion/' + id, {
            method: 'PUT'
        })
            .then(response => {
                if (response.ok) {
                    // window.location.reload();
                    window.location.href = '/update_question/'+id;
                }
            });
    }
</script>
<body>

<table border="1" class ="table table-hover table-responsive-md" >

    <tr>
        <th>ID</th>
        <th>Desc</th>
        <th>Option1</th>
        <th>Option2</th>
        <th>Option3</th>
        <th>Option4</th>
        <th>Correct Ans</th>
    </tr>

    <tr th:each="question, stat : ${questions}">
        <td th:text="${stat.count}"></td>
        <td th:text="${question.questionDesc}"></td>
        <td th:text="${question.option1}"></td>
        <td th:text="${question.option2}"></td>
        <td th:text="${question.option3}"></td>
        <td th:text="${question.option4}"></td>
        <td th:text="${question.rightAnswer}"></td>
        <td><a th:href="@{/updateQuestion/{id}(id=${question.id})}" class = "btn btn-warning btn-sm md-2">Update</a></td>
        <td><button th:onclick="'deleteQuestion(' + ${question.id} + ')'" class = "btn btn-danger btn-sm md-2">Delete</button></td>

    </tr>
</table>
<a th:href ="@{/add_question}" class ="btn btn-primary btn-sm mb-3">Add Questions</a>
</body>
</html>
