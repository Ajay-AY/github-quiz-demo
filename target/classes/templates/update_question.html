<!DOCTYPE html>
<html lang="en" xmlns:th = "http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Question</title>
    <link rel="stylesheet" href="/css/question.css">
</head>
<body>
<form action="#" th:action="@{/updateQuestion}" th:object="${question}" method="post">
    Description <br>
    <br><input name="questionDesc" placeholder="Enter your question" th:field ="*{questionDesc}" required></th:input><br>
    Option1 <br><input type="text"name="option1" placeholder="Enter your option" th:field ="*{option1}" required></input><br>
    Option2 <br><input type="text" name="option2" placeholder="Enter your option" th:field ="*{option2}" required></input><br>
    Option3 <br><input type="text" name="option3" placeholder="Enter your option" th:field ="*{option3}" required></input><br>
    Option4 <br><input type="text" name="option4" placeholder="Enter your option" th:field ="*{option4}" required></input><br>
    Right Answer <br><input type="text" name="rightAnswer" placeholder="Enter your right answer" th:field ="*{rightAnswer}" required></input><br>
    <input type="text" name ="id" th:field="*{id}" style = "display: none;">
   <br> <input type="submit" value="Submit">
</form>
</body>
</html>
